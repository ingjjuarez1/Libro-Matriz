<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libro Matriz FP · DETP Jujuy</title>
  <link rel="stylesheet" href="/css/estilos.css?v=20261105e">
</head>
<body>
  <header class="barra">
    <div class="marca">
      <strong>Libro Matriz FP</strong>
      <span class="sub">Dirección de Educación Técnico Profesional · Jujuy</span>
    </div>
    <div class="usuario-panel">
      <button class="boton" id="btnTopImportar" style="background:#137333;border:1px solid rgba(255,255,255,0.4);padding:5px 10px;font-size:12px">📥 Importar Viejo Excel</button>
      <button class="boton" id="btnTopUsuarios" style="background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.4);padding:5px 10px;font-size:12px">👤 Usuarios</button>
      <div class="usuario" id="usuario"></div>
      <select id="selectorUsuario" class="selector-rol" title="Cambiar usuario para pruebas"></select>
    </div>
  </header>

  <nav class="migas" id="migas" hidden>
    <button class="enlace" id="volver">&larr; Volver a los cursos</button>
  </nav>

  <main id="main">
    <div class="cargando">Cargando Libro Matriz FP…</div>
  </main>

  <div class="aviso" id="aviso" hidden></div>

  <script src="/js/app.js?v=20261105e"></script>
</body>
</html>
