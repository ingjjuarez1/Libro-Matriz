<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ministerio de Educación · Jujuy · Secretaría de Gestión Educativa · DETP · RAC y Títulos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css?v=20261119q">
</head>
<body>
  <!-- FACHADA OFICIAL MINISTERIO DE EDUCACIÓN DE JUJUY (educacion.jujuy.gob.ar) -->
  <header class="barra">
    <!-- Franja superior institucional -->
    <div class="barra-top-gob">
      <div class="gob-logo-top">
        <img src="/img/logo_gobierno_jujuy.png" alt="Gobierno de Jujuy · Crece con la gente">
      </div>
      <div class="usuario-panel">
        <a href="/" class="nav-link-gob">Inicio</a>
        <a href="/manual.html" target="_blank" id="btnTopManual" class="nav-link-gob" title="Abrir Manual del Usuario de tu rol">📖 Manual de Usuario</a>
        <button class="nav-btn-gob" id="btnTopDashboard" hidden>📊 Dashboard de Estadísticas</button>
        <button class="nav-btn-gob nav-btn-acento" id="btnTopImportar">📥 Importar Viejo Excel</button>
        <button class="nav-btn-gob" id="btnTopUsuarios">👤 Usuarios</button>
        <div class="webmail-pill">
          <div class="usuario" id="usuario"></div>
          <select id="selectorUsuario" class="selector-rol" title="Cambiar usuario para pruebas"></select>
        </div>
      </div>
    </div>

    <!-- Banner central Ministerio de Educación con edificio y guarda jujeña -->
    <div class="banner-ministerio">
      <div class="banner-min-izq">
        <div class="min-titulo-bloque">
          <span class="min-prefijo">Ministerio de</span>
          <strong class="min-palabra">Educación</strong>
        </div>
        <div class="marca">
          <strong id="barraTitulo">Secretaría de Gestión Educativa - Dirección de Educación Técnico Profesional</strong>
          <span class="sub" id="barraEscuela">Escuela Profesional Nº 6</span>
        </div>
      </div>
      <div class="banner-min-centro">
        <img src="/img/banner_edificio_jujuy.png" alt="Complejo Ministerial · Ministerio de Educación de Jujuy">
      </div>
      <div class="banner-min-der">
        <img src="/img/logo_gobierno_jujuy.png" alt="Gobierno de Jujuy · Crece con la gente">
      </div>
    </div>
  </header>

  <nav class="migas" id="migas" hidden>
    <button class="enlace" id="volver">&larr; Volver a los cursos</button>
  </nav>

  <main id="main">
    <div class="cargando">Cargando Registro Anual de Calificaciones…</div>
  </main>

  <div class="aviso" id="aviso" hidden></div>

  <script src="/js/app.js?v=20261119q"></script>
</body>
</html>
